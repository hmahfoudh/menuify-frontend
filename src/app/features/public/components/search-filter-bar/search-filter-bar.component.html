<!-- ── Search + Filter bar ─────────────────────────────────────────────────── -->
<div class="sfb-wrapper">

  <!-- Search row -->
  <div class="sfb-search-row">
    <div class="sfb-search-field" [class.sfb-search-field--filled]="searchQuery().length > 0">

      <span class="sfb-search-icon">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none"
             stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8.5" cy="8.5" r="5.5"/>
          <line x1="13.5" y1="13.5" x2="18" y2="18"/>
        </svg>
      </span>

      <input
        class="sfb-input"
        type="search"
        [placeholder]="'menu.search.placeholder' | translate"
        [ngModel]="searchQuery()"
        (ngModelChange)="onQueryInput($event)"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        enterkeyhint="search"
      />

      @if (searchQuery().length > 0) {
        <button class="sfb-clear-input" (click)="onQueryInput('')" aria-label="Clear search">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="1" y1="1" x2="11" y2="11"/>
            <line x1="11" y1="1" x2="1" y2="11"/>
          </svg>
        </button>
      }
    </div>

    <!-- Clear-all pill: shown when any filter or query is active -->
    @if (hasActiveState()) {
      <button class="sfb-clear-all" (click)="clearAll()">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="1" y1="1" x2="11" y2="11"/>
          <line x1="11" y1="1" x2="1" y2="11"/>
        </svg>
        {{ 'menu.filter.clear' | translate }}
      </button>
    }
  </div>

  <!-- Filter chips row (only rendered when ≥1 chip is available) -->
  @if (visibleChips().length > 0) {
    <div class="sfb-chips-row">
      @for (chip of visibleChips(); track chip.key) {
        <button
          class="sfb-chip"
          [class.sfb-chip--active]="isActive(chip.key)"
          (click)="toggleFilter(chip.key)">
          <span class="sfb-chip-emoji">{{ chip.emoji }}</span>
          {{ chip.label }}
        </button>
      }
    </div>
  }

</div>
